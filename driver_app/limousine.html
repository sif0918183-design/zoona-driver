<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ليموزين تراكا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--tech-bg,#f5f7fa);color:var(--tech-text,#172033);font-family:Tajawal,sans-serif;padding:16px 14px 40px}
.wrap{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{font-size:23px;margin:0}.back{color:var(--Tracka-primary,#0d9488);text-decoration:none;font-weight:700}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px rgba(15,23,42,.04)}
h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#475569}input,select,textarea{width:100%;border:1px solid #dbe1e8;border-radius:11px;padding:12px;font:inherit;background:#fff;color:#172033}textarea{min-height:75px;resize:vertical}
.primary,.secondary,.small{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--Tracka-primary,#0d9488);color:#fff;width:100%}.secondary{background:#fff1e7;color:#9a4b11}.small{background:#e8f4f2;color:#0f766e;padding:7px 12px;font-size:13px}.primary:disabled,.small:disabled{opacity:.55}
.estimate{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:12px;padding:12px;font-size:14px;margin:8px 0 14px;line-height:1.8}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{font-size:12px;border-radius:30px;background:#eef2ff;color:#4338ca;padding:5px 10px}.muted{color:#64748b;font-size:13px}.empty{padding:22px;text-align:center;color:#64748b;background:#fff;border-radius:14px}.notice{display:none;padding:12px;border-radius:12px;margin:12px 0;background:#dcfce7;color:#166534}.notice.show{display:block}.notice.error{background:#fee2e2;color:#991b1b}.driver-list{border-top:1px solid #eef2f7;margin-top:12px;padding-top:10px}.driver-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13px}.chat{border-top:1px solid #e5e7eb;margin-top:12px;padding-top:12px}.messages{max-height:220px;overflow:auto}.message{padding:9px 11px;border-radius:12px;background:#f1f5f9;margin:7px 0;max-width:90%}.message.mine{margin-right:auto;background:#e0f2fe}.message small{display:block;color:#64748b;font-size:10px;margin-top:4px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.top h1{font-size:20px}}
</style></head>
<body data-role="driver"><div class="wrap" id="app">
<header class="top"><h1>🚘 ليموزين تراكا</h1><a class="back" href="/driver_app/index.html">العودة للتطبيق</a></header>
<div id="notice" class="notice"></div>\n<section class="card"><div class="line"><h2>تنبيهات ليموزين تراكا</h2><span class="muted">تحديث تلقائي</span></div><div id="notifications"><div class="empty">جارٍ التحميل...</div></div></section>
<section class="card"><h2>طلبات التأجير المتاحة</h2><p class="muted">يمكنك قبول الطلب مبدئياً. لا يتم خصم أو حجز العمولة عند القبول.</p></section>
<section class="card"><div class="line"><h2>طلبات مناسبة لسيارتك</h2><button id="refresh" class="small">تحديث</button></div><div id="requests"><div class="empty">جارٍ التحميل...</div></div></section>
<section class="card"><h2>عقودي ومحادثاتي</h2><div id="contracts"><div class="empty">جارٍ التحميل...</div></div></section>
</div><script src="/shared/limousine-app.js"></script></body></html>
